name: Daily House Sync

on:
  workflow_dispatch:
  schedule:
    # GitHub cron uses UTC; run three times daily.
    - cron: "15 0,8,16 * * *"

permissions:
  contents: write

concurrency:
  group: daily-house-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out data
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Scrape and update SQLite
        env:
          PYTHONPATH: ${{ github.workspace }}/backend
          UKH_DATA_SOURCE: onthemarket
          UKH_DATABASE_URL: sqlite:///${{ github.workspace }}/data/ukhouse.db
          UKH_SCHEDULER_TIMEZONE: Europe/London
          UKH_OTHEM_MAX_PAGES: "15"
          UKH_SYNC_TIMES: "00:15,08:15,16:15"
          UKH_SMTP_HOST: ${{ secrets.UKH_SMTP_HOST }}
          UKH_SMTP_PORT: ${{ secrets.UKH_SMTP_PORT || 465 }}
          UKH_SMTP_USERNAME: ${{ secrets.UKH_SMTP_USERNAME }}
          UKH_SMTP_PASSWORD: ${{ secrets.UKH_SMTP_PASSWORD }}
          UKH_EMAIL_TO: haha030324@gmail.com
          UKH_EMAIL_FROM: ${{ secrets.UKH_EMAIL_FROM }}
        run: python -m app.jobs.github_sync

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ukhouse.db
          if git diff --cached --quiet; then
            echo "No database changes to commit"
          else
            git commit -m "chore: daily property sync"
            git push
          fi
